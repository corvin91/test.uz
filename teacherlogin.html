<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Teacher Login</title>
  <link rel="stylesheet" href="teacherlogin.css">
</head>
<body>

  <div class="login-box">
    <h1>👨‍🏫 Teacher Login</h1>
    <p>O‘qituvchi hisobiga kirish</p>

    <form id="loginForm">
      <div class="input-box">
        <input type="text" id="login" required>
      </div>

      <div class="input-box">
        <input type="password" id="password" required>
      </div>

      <button type="submit">Kirish</button>
    </form>

    <p id="error"></p>
  </div>

  <script src="teacherlogin.js"></script>
</body>
</html>
